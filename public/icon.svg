<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&amp;display=swap");
      .logo-text {
        font-family: "Playfair Display", Georgia, "Times New Roman", serif;
        font-weight: 900;
        font-size: 340px;
        fill: #ffffff;
      }
    </style>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#logo-grad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="16" />
  <text x="50%" y="56%" text-anchor="middle" dominant-baseline="middle" class="logo-text">M</text>
