<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient matching AppIcon -->
    <linearGradient id="logo-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="50%" stop-color="#4c0519" />
      <stop offset="100%" stop-color="#1c000a" />
    </linearGradient>
    
    <!-- Royal Serif Monogram M Gradient matching the new logo -->
    <linearGradient id="text-gold-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&amp;display=swap");
      .logo-text {
        font-family: "Playfair Display", Georgia, "Times New Roman", serif;
        font-weight: 900;
        font-size: 297px;
        fill: url(#text-gold-grad);
        filter: drop-shadow(0px 6px 12px rgba(0,0,0,0.5));
      }
    </style>
  </defs>

  <!-- Base Smooth Rounded Card Container -->
  <rect width="512" height="512" rx="143" fill="url(#logo-bg-grad)" />

  <!-- Inner precision Bezels for premium carved depth -->
  <rect x="20" y="20" width="472" height="472" rx="133" fill="none" stroke="#7c2d12" stroke-width="4" opacity="0.25" />
  <rect x="25" y="25" width="462" height="462" rx="128" fill="none" stroke="#fcd34d" stroke-width="2.5" opacity="0.1" />

  <!-- Central Crest Serif 'M' Monogram -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" class="logo-text">M</text>
</svg>
